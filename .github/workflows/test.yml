name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: go mod verify
      - run: test -z "$(gofmt -l .)"
      - name: Install Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version
      - run: go test -count=1 -tags "fts5 sqlite_omit_load_extension" -run TestBrowserE2E -timeout 180s -v ./internal/server/
      - run: go test -race -count=1 -tags "fts5 sqlite_omit_load_extension" ./...
      - run: go vet -tags "fts5 sqlite_omit_load_extension" ./...
      - run: node --test internal/server/web/app.test.js
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks dir --redact --no-banner
      - run: gitleaks git --redact --no-banner
